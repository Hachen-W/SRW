services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"     # веб-панель, guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    # Образ собирается один раз здесь, воркеры используют его же
    image: new_sipuha-app
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MAX_FILE_SIZE_MB: "500"
      # tempfile берёт каталог отсюда — так временный файл видит и воркер
      TMPDIR: /data/audio
    volumes:
      - audio:/data/audio
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: new_sipuha-app
    restart: unless-stopped
    working_dir: /app/core
    command: python worker.py
    env_file: .env
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MODEL_TYPE: pytorch
      TMPDIR: /data/audio
    volumes:
      - audio:/data/audio
      - ./core/logs:/app/core/logs
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  stream-worker:
    image: new_sipuha-app
    restart: unless-stopped
    working_dir: /app/core
    command: python streaming_worker.py
    env_file: .env
    environment:
      REDIS_HOST: redis
      MODEL_TYPE: pytorch
      # Не обрывать сессию на первом spoof: нужна кривая по всей записи
      TERMINATE_ON_SPOOF: "false"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  audio:

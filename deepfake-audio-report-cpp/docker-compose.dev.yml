services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: audio-forensics-dev

    # Общая сеть с хостом: приложение видит SRW на localhost:8000,
    # а X11 и звук работают без дополнительных настроек
    network_mode: host

    environment:
      DISPLAY: ${DISPLAY}
      PULSE_SERVER: unix:/tmp/pulse-native

    volumes:
      - .:/project
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # сокет звукового сервера — иначе кнопка «Слушать» промолчит
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/tmp/pulse-native:ro

    working_dir: /project
    stdin_open: true
    tty: true

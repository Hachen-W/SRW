services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"     # веб-панель, логин guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    working_dir: /app/New_Sipuha
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      # tempfile берёт каталог отсюда — так временный файл видит и воркер
      TMPDIR: /data/audio
    volumes:
      - audio:/data/audio
      - db:/data/db
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    working_dir: /app/New_Sipuha/core
    command: python worker.py
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MODEL_TYPE: pytorch
      TMPDIR: /data/audio
    volumes:
      - audio:/data/audio
      - ./New_Sipuha/core/logs:/app/New_Sipuha/core/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  stream-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    working_dir: /app/New_Sipuha/core
    command: python streaming_worker.py
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      # Не обрывать сессию на первом spoof: нужна кривая по всей записи
      TERMINATE_ON_SPOOF: "false"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  audio:
  db:
